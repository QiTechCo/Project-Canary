<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Volunteer Portal | Dimple Ajmera for Charlotte</title>
  <meta name="description" content="Volunteer Portal login for Dimple Ajmera's campaign. Access shifts, assignments, wiki, and campaign resources.">
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Theme Styles -->
  <link rel="stylesheet" href="assets/css/site.css">

  <style>
    .portal-login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(175deg, #ffffff 0%, #f1f5f9 50%, #e8edf3 100%);
      position: relative;
      overflow: hidden;
    }

    .portal-login-page::before {
      content: '';
      position: absolute;
      top: -150px;
      right: -150px;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(237, 28, 36, 0.05) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    .portal-login-page::after {
      content: '';
      position: absolute;
      bottom: -120px;
      left: -120px;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(0, 120, 80, 0.04) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    .portal-login-card {
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
      padding: 3rem;
      max-width: 480px;
      width: 100%;
      position: relative;
      z-index: 2;
      border: 1px solid rgba(0, 0, 0, 0.05);
    }

    .portal-login-card .portal-logo {
      max-width: 260px;
      width: 100%;
      height: auto;
      margin-bottom: 1.5rem;
      border-radius: 50%;
      box-shadow: 0 12px 35px rgba(15, 32, 66, 0.14);
      transition: transform 0.3s ease;
    }

    .portal-login-card .portal-logo:hover {
      transform: scale(1.03);
    }

    .portal-login-card .form-control {
      border-radius: 12px;
      padding: 0.85rem 1rem;
      border: 1.5px solid #e2e8f0;
      font-size: 1rem;
      transition: all 0.2s ease;
    }

    .portal-login-card .form-control:focus {
      border-color: var(--navy-medium);
      box-shadow: 0 0 0 3px rgba(27, 54, 93, 0.12);
    }

    .portal-divider {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 1.5rem 0;
      color: #94a3b8;
      font-size: 0.85rem;
    }

    .portal-divider::before,
    .portal-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #e2e8f0;
    }
  </style>
</head>
<body>

<!-- Minimal Top Bar -->
<nav class="navbar navbar-campaign">
  <div class="container-fluid px-lg-4 px-xl-5">
    <a class="navbar-brand" href="index.html">
      <img src="assets/images/whiteboard_9_navlogo.png" alt="Dimple Ajmera" style="height: 48px; width: auto;">
    </a>
    <a href="index.html" class="btn btn-outline-dark btn-sm">
      <i class="bi bi-arrow-left me-1"></i> Back to Site
    </a>
  </div>
</nav>

<section class="portal-login-page">
  <div class="portal-login-card text-center">
    <img src="assets/images/volunteer_hub_logo.jpeg" alt="Volunteer Hub - Dimple Ajmera for Charlotte Campaign" class="portal-logo img-fluid">

    <p class="text-muted mb-4">
      Enter your email address to sign in with a secure magic link, or register as a new campaign volunteer.
    </p>

    <!-- Magic Link Login Form -->
    <form id="loginForm">
      <div class="mb-3 text-start">
        <label for="loginEmail" class="form-label fw-bold small">Email Address</label>
        <input type="email" class="form-control" id="loginEmail" placeholder="you@example.com" required>
      </div>

      <button type="submit" class="btn btn-red-patriot btn-lg w-100 mb-2" id="loginBtn">
        <i class="bi bi-envelope-check-fill me-2"></i> Send Magic Link
      </button>

      <p class="text-muted small mt-2">
        We'll send a secure login link to your email. No password needed.
      </p>
    </form>

    <div class="portal-divider">or</div>

    <!-- Sign Up CTA -->
    <a href="volunteer.html" class="btn btn-blue-patriot w-100">
      <i class="bi bi-people-fill me-2"></i> Join as a New Volunteer
    </a>
  </div>
</section>

<!-- Login Status Toast -->
<div class="position-fixed bottom-0 end-0 p-3" style="z-index: 9999;">
  <div id="loginToast" class="toast align-items-center text-bg-success border-0" role="alert">
    <div class="d-flex">
      <div class="toast-body">
        <i class="bi bi-check-circle-fill me-2"></i> Magic link sent! Check your email inbox.
      </div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // Portal Login (Supabase integration placeholder)
  document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const email = document.getElementById('loginEmail').value;
    const btn = document.getElementById('loginBtn');
    
    // Show loading state
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Sending...';

    // Wire up Supabase Magic Link auth
    setTimeout(() => {
      btn.disabled = false;
      btn.innerHTML = '<i class="bi bi-envelope-check-fill me-2"></i> Send Magic Link';
      
      // Show success toast
      const toast = new bootstrap.Toast(document.getElementById('loginToast'));
      toast.show();
    }, 1500);
  });
</script>
</body>
</html>
